; PyOmicron configuration file for {{ production.name }}
; Generated by asimov-pyomicron
; Event: {{ production.event.name }}

[{{ production.name }}]
; Data selection
channels = {{ pipeline.channel_names }}
frametype = {{ pipeline.frametype }}

; Timing parameters
chunk-duration = {{ pipeline.chunk_duration }}
segment-duration = {{ pipeline.segment_duration }}
overlap-duration = {{ pipeline.overlap_duration }}

{% if pipeline.state_flag %}
; State information
state-flag = {{ pipeline.state_flag }}
{% elsif pipeline.state_channel %}
; State information
state-channel = {{ pipeline.state_channel }}
state-frametype = {{ pipeline.state_frametype }}
state-bits = {{ pipeline.state_bits }}
{% endif %}

; Search parameters
frequency-range = {{ pipeline.frequency_range }}
q-range = {{ pipeline.q_range }}
{% if pipeline.mismatch_max %}
mismatch-max = {{ pipeline.mismatch_max }}
{% endif %}
{% if pipeline.snr_threshold %}
snr-threshold = {{ pipeline.snr_threshold }}
{% endif %}
{% if pipeline.sample_frequency %}
sample-frequency = {{ pipeline.sample_frequency }}
{% endif %}
