; PyOmicron configuration file for {{ production.name }}
; Generated by asimov-pyomicron
; Event: {{ production.event.name }}

[{{ production.name }}]
; Data selection
channels = {{ pipeline.channel_names }}
frametype = {{ pipeline.frametype }}

; Timing parameters
chunk-duration = {{ production.meta.omicron.chunk_duration | default: 124 }}
segment-duration = {{ production.meta.omicron.segment_duration | default: 64 }}
overlap-duration = {{ production.meta.omicron.overlap_duration | default: 4 }}

{% if production.meta.omicron.state_flag %}
; State information
state-flag = {{ production.meta.omicron.state_flag }}
{% elsif production.meta.omicron.state_channel %}
; State information
state-channel = {{ production.meta.omicron.state_channel }}
state-frametype = {{ production.meta.omicron.state_frametype }}
state-bits = {{ production.meta.omicron.state_bits }}
{% endif %}

; Search parameters
frequency-range = {{ production.meta.omicron.frequency_range | default: "4.0 8192.0" }}
q-range = {{ production.meta.omicron.q_range | default: "3.3166 150" }}
{% if production.meta.omicron.mismatch_max %}
mismatch-max = {{ production.meta.omicron.mismatch_max }}
{% endif %}
{% if production.meta.omicron.snr_threshold %}
snr-threshold = {{ production.meta.omicron.snr_threshold }}
{% endif %}
{% if production.meta.omicron.sample_frequency %}
sample-frequency = {{ production.meta.omicron.sample_frequency }}
{% endif %}
